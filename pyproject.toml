[build-system]
requires = ["setuptools>=83,<85", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "modelscraper"
version = "0.1.0"
description = "Local multi-platform model availability scraper"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11,<3.15"
dependencies = [
    "setuptools>=83,<85",
    "PySide6>=6.10,<7",
    "selenium>=4.39,<5",
    "undetected-chromedriver>=3.5.5,<4",
    "fastapi>=0.139,<1",
    "uvicorn>=0.49,<1",
    "httpx>=0.28,<1",
    "requests>=2.32,<3",
    "pydantic>=2.13,<3",
    "websocket-client>=1.9,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "packaging>=25,<27",
]

[tool.setuptools]
# Every top-level module reachable at runtime from gui_app or web_app.
# test_packaging.py recomputes this closure and fails when one is missing.
py-modules = [
    "app_settings",
    "ctb_api",
    "ctb_classifier",
    "ctb_core",
    "ctb_store",
    "ctb_verifier",
    "country_choices",
    "external_search",
    "gui_app",
    "legacy_stripchat_family",
    "location_profiles",
    "manual_workflow",
    "machine_policy",
    "master_repository",
    "mfc_verifier",
    "mfcscrape",
    "modelscraper_service",
    "mullvad_vpn",
    "platform_contracts",
    "platform_workflow",
    "public_runtime",
    "runtime_lock",
    "session_registry",
    "storage_utils",
    "stripchat_adapter",
    "stripchat_api",
    "stripchat_browser_runtime",
    "stripchat_classifier",
    "stripchat_core",
    "stripchat_store",
    "temp_profile",
    "web_app",
    "vpn_providers",
    "windows_subprocess",
    "workflow_coordinator",
    "workflow_finalizer",
    "workflow_store",
    "workflow_types",
    "workflow_verifier",
    "xhamsterlive_core",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-ra"
